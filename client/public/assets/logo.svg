<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 70" width="460" height="70">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#B9121B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Hexagonal Shield Icon -->
  <g transform="translate(10, 5)">
    <!-- Outer Matte Black Hexagon -->
    <polygon points="30,2 58,18 58,50 30,66 2,50 2,18" fill="#111111" stroke="#232F53" stroke-width="2"/>
    <!-- Inner Scarlet Rim -->
    <polygon points="30,8 52,21 52,47 30,60 8,47 8,21" fill="#0A1329" stroke="#B9121B" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Crosshair Dotted Lines -->
    <line x1="30" y1="12" x2="30" y2="56" stroke="#B9121B" stroke-dasharray="3,3" stroke-width="1.5"/>
    <line x1="12" y1="34" x2="48" y2="34" stroke="#B9121B" stroke-dasharray="3,3" stroke-width="1.5"/>
    <!-- Center Diamond and Target Dot -->
    <polygon points="30,22 38,34 30,46 22,34" fill="#FDFDFD"/>
    <circle cx="30" cy="34" r="3.5" fill="#B9121B"/>
  </g>

  <!-- Typography -->
  <text x="85" y="44" font-family="'Syne', sans-serif" font-size="34" font-weight="900" letter-spacing="3" fill="#FDFDFD">
    PARTY <tspan fill="#B9121B">ARENA</tspan>
  </text>
  <text x="86" y="58" font-family="'Space Mono', monospace" font-size="9" font-weight="700" letter-spacing="4.5" fill="#94A3B8">
    MULTIPLAYER COMBAT BRAWLER
  </text>
  <!-- Scarlet Accent Underline -->
  <rect x="85" y="63" width="340" height="2" fill="#B9121B"/>
</svg>
